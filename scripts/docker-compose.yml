# ============================================================================
# DineBox 扫码点餐 · 本地/单机环境编排
#   MySQL 8.0 + Redis 7.4 + RustFS（S3 兼容）+ API（Hono）
#   + Web（Next.js 顾客 H5）+ Admin（React 管理/收银端）
#   + ESC/POS 虚拟打印机（TCP 9100 + 指令解析模拟器）
#
# 启动全部：docker compose -f scripts/docker-compose.yml up -d --build
# 仅基础服务：docker compose -f scripts/docker-compose.yml up -d mysql redis rustfs
# 停止：    docker compose -f scripts/docker-compose.yml down
# 重置：    docker compose -f scripts/docker-compose.yml down -v（会清空数据）
#
# 首次启动且 mysql_data 卷为空时，会依次执行：
#   1) scripts/init/01-schema.sql（20 张表 + 基础种子 + 演示打印机）
#   2) scripts/init/02-demo-data.sql（近 7 天订单、打印日志、操作日志）
#
# 生产部署时请务必替换 MySQL 密码、JWT_SECRET 与 RustFS 密钥，
# 并把 H5_PUBLIC_URL 改为局域网可访问地址，否则手机扫码无法打开 H5。
# 环境变量可写入同目录 .env（参考 .env.example）。
# ============================================================================
name: dinebox

services:
  mysql:
    image: mysql:8.0
    container_name: dinebox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dinebox}
      MYSQL_USER: ${MYSQL_USER:-dinebox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据目录为空（首次初始化）时执行，按文件名顺序执行
      - ./init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    # Redis：API 缓存与限流，多实例共享计数
    image: redis:7.4
    container_name: dinebox-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rustfs:
    # RustFS：S3 兼容对象存储，保存菜品图片
    image: rustfs/rustfs:latest
    container_name: dinebox-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      TZ: Asia/Shanghai
    ports:
      - '${S3_PORT:-9100}:9000'
      - '${S3_CONSOLE_PORT:-9101}:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s

  api:
    build:
      context: ../dinebox-monorepo
      dockerfile: apps/api/Dockerfile
    image: dinebox-api:local
    container_name: dinebox-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-dinebox}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-dinebox}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET:-dinebox-dev-secret-change-me-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090,http://localhost:8091}
      H5_PUBLIC_URL: ${H5_PUBLIC_URL:-http://localhost:8090}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_PREFIX: ${CACHE_PREFIX:-dinebox}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-dinebox}
      S3_FORCE_PATH_STYLE: 'true'
      PRINT_ENCODING: ${PRINT_ENCODING:-gbk}
      PRINT_TIMEOUT_MS: ${PRINT_TIMEOUT_MS:-5000}
      PRINT_WIDTH: ${PRINT_WIDTH:-32}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      TZ: Asia/Shanghai
    ports:
      - '${API_PORT:-3100}:3100'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

  web:
    build:
      context: ../dinebox-monorepo
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:3100
    image: dinebox-web:local
    container_name: dinebox-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
    ports:
      - '${WEB_PORT:-8090}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 10s

  admin:
    build:
      context: ../dinebox-monorepo
      dockerfile: apps/admin/Dockerfile
    image: dinebox-admin:local
    container_name: dinebox-admin
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    ports:
      - '${ADMIN_PORT:-8091}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

  escpos:
    # ESC/POS 虚拟打印机：Web 控制台 + 指令解析 + RAW TCP 9100
    # 宿主机把 TCP 映射为 9102，避免占用真实打印机的 9100；
    # 商家端打印配置里填写「局域网 IP:9102」即可把任务发到模拟器。
    build:
      context: ../dinebox-monorepo
      dockerfile: apps/escpos/Dockerfile
    image: dinebox-escpos:local
    container_name: dinebox-escpos
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      ESC_POS_PORT: 3200
      ESC_POS_TCP_PORT: 9100
      ESC_POS_ADVERTISE_PORT: ${ESCPOS_TCP_PORT:-9102}
      ESC_POS_PUBLIC_HOST: ${ESCPOS_PUBLIC_HOST:-}
      TZ: Asia/Shanghai
    ports:
      - '${ESCPOS_PORT:-8092}:3200'
      - '${ESCPOS_TCP_PORT:-9102}:9100'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 10s

volumes:
  mysql_data:
    name: dinebox_mysql_data
  redis_data:
    name: dinebox_redis_data
  rustfs_data:
    name: dinebox_rustfs_data
